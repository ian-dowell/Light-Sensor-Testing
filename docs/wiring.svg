<text x="82" y="1193" font-size="23" fill="#182c3d" font-weight="700" text-anchor="start">Connection notes</text>
<text x="82" y="1227" font-size="21" fill="#536575" font-weight="400" text-anchor="start">Use 3.3 V at every sensor VIN and one common GND. Leave each sensor&#x27;s regulator-output pin unconnected.</text>
<text x="82" y="1258" font-size="21" fill="#536575" font-weight="400" text-anchor="start">BNO085: leave SCL/RX, DI, CS, INT, RST and BT open; do not connect its STEMMA QT socket to the I2C bus.</text>
<text x="82" y="1289" font-size="21" fill="#536575" font-weight="400" text-anchor="start">Keep P1 jumper open; set P0/P1 with power off, then power-cycle. Keep light-sensor extra pins / address at defaults.</text>
<text x="60" y="1358" font-size="18" fill="#536575" font-weight="400" text-anchor="start">Logical wiring diagram • Pin order is illustrative • See README.md for setup, pin table and official sources</text>
</g></svg>
